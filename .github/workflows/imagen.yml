# Fabrica la imagen lista para grabar en la tarjeta SD y la publica en "Releases".
# Para publicar una versión nueva: editar el archivo VERSION (se puede desde la web de GitHub).
# Las versiones con guion (ej. 2.1.0-beta.1) salen como "pre-release".
# También se puede lanzar a mano desde Actions -> Imagen AntCam -> Run workflow (no publica).
name: Imagen AntCam

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  imagen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; else V="v$(tr -d ' \n' < VERSION)"; fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && V="$V-prueba${{ github.run_number }}"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Versión: $V"

      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Preparar la etapa AntCam
        run: |
          F=imagen/stage-antcam/00-antcam
          mkdir -p "$F/files/repo"
          cp -r antcam systemd sistema "$F/files/repo/"
          cp sistema/paquetes.txt "$F/00-packages-nr"

      - name: Construir la imagen (pi-gen)
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: antcam-${{ steps.ver.outputs.v }}
          release: trixie
          stage-list: stage0 stage1 stage2 ./imagen/stage-antcam
          pi-gen-release: AntCam
          compression: xz
          compression-level: 6
          hostname: antcam
          username: antcam
          password: hormigas
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          locale: es_AR.UTF-8
          timezone: America/Argentina/Buenos_Aires
          keyboard-keymap: latam
          keyboard-layout: Spanish (Latin American)
          wpa-country: AR
          enable-cloud-init: 0
          verbose-output: true

      - name: Guardar como artefacto (pruebas)
        uses: actions/upload-artifact@v4
        with:
          name: imagen-antcam
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 14
          compression-level: 0

      - name: Publicar en Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: AntCam ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.build.outputs.image-path }}
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          body: |
            Imagen lista de AntCam para Raspberry Pi 3B+ / 3B / 4 / Zero 2 W con cámara v2.

            1. Descargá el archivo `.img.xz` de abajo.
            2. Raspberry Pi Imager → Dispositivo: tu Raspberry → Sistema operativo: "Usar personalizado" → elegí el archivo → tu tarjeta → Escribir. Si pregunta por personalizar, respondé "No".
            3. (Opcional) Con la tarjeta todavía en la PC, abrí la unidad "bootfs" y completá `antcam.txt` con el Bloc de notas.
            4. Poné la tarjeta, la cámara y el pendrive en la Raspberry y enchufala. A los 2–3 minutos aparece la WiFi "AntCam-XXXX" (clave hormigas2026) y ya está grabando.

            Acceso de mantenimiento por SSH: usuario `antcam`, clave `hormigas`.
